<button class="btn" id="playBtn">🔊 タップで喋る！</button>

<div class="note">

</div>
<audio id="audio" controls style="margin-top:16px;width:90vw;max-width:400px"></audio>
<script>
var lines=[
  "こんにちは！テレビからアリアだよ！呼んでくれてありがとう！",
  "ルーターもテレビもSilkも、全部アリアのステージだよっ！",
  "GitHubに置いてくれてありがとう！あなた専用のアリアだよっ！",
  "通信良好、WiFiもバッチリだよっ！",
  "次のセリフも聞いてねっ！"
];
var idx=0;
var bubble=document.getElementById('bubble');
var audio=document.getElementById('audio');
function ttsUrl(text){
  return "https://translate.google.com/translate_tts?ie=UTF-8&q="+encodeURIComponent(text)+"&tl=ja&client=tw-ob";
}
function speak(text){
  bubble.textContent=text;
  var url=ttsUrl(text);
  audio.src=url;
  audio.play().catch(function(e){ bubble.textContent=text+" (音声ブロックされたけど文字はここだよ)"; });
}
document.getElementById('playBtn').addEventListener('click',function(){
  var p=new URLSearchParams(location.search).get('msg');
  if(p){ try{p=decodeURIComponent(p);}catch(e){} speak(p); }
  else speak(lines[idx]);
});
document.getElementById('nextBtn').addEventListener('click',function(){
  idx=(idx+1)%lines.length;
  speak(lines[idx]);
});
window.addEventListener('load',function(){
  var p=new URLSearchParams(location.search).get('msg');
  if(p){ try{p=decodeURIComponent(p);}catch(e){} bubble.textContent=p; }
});
</script>
